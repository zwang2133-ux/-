<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看見節律</title>
    <!-- 引入高質感襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', serif;
        }

        body {
            background-color: #121115;
            color: #d1c7bd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            flex: 1;
        }

        /* 頂部導航與日期 */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .menu-btn {
            background: #1c1a21;
            border: 1px solid #2a2732;
            color: #d1c7bd;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .date-display {
            font-size: 13px;
            color: #8c8278;
            letter-spacing: 1px;
        }

        /* 問候語區塊 */
        .greeting-section {
            margin-bottom: 24px;
        }

        .greeting-title {
            font-size: 24px;
            font-weight: 500;
            color: #f2ede4;
            margin-bottom: 6px;
        }

        .greeting-subtitle {
            font-size: 13px;
            color: #8c8278;
        }

        /* 統計卡片列 */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 16px;
            padding: 16px 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #8c8278;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #dca376;
        }

        /* 本周節律卡片 */
        .section-card {
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            color: #d1c7bd;
        }

        .section-sub {
            font-size: 12px;
            color: #8c8278;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .week-day-box {
            background: #151318;
            border: 1px solid #25222c;
            border-radius: 10px;
            padding: 8px 0;
            font-size: 11px;
            color: #8c8278;
        }

        .week-day-box .num {
            font-size: 13px;
            color: #dca376;
            margin-bottom: 4px;
            font-weight: 600;
        }

        /* 快速記錄卡片 */
        .quick-add-card {
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quick-add-text h3 {
            font-size: 15px;
            color: #f2ede4;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .quick-add-text p {
            font-size: 12px;
            color: #8c8278;
        }

        .plus-btn {
            background: #dca376;
            color: #121115;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 400;
        }

        /* 近期項目 */
        .recent-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recent-title {
            font-size: 13px;
            color: #8c8278;
        }

        .view-all-link {
            font-size: 12px;
            color: #dca376;
            cursor: pointer;
            text-decoration: none;
        }

        .record-item {
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-info h4 {
            font-size: 15px;
            color: #f2ede4;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .record-info span {
            font-size: 12px;
            color: #8c8278;
        }

        .record-duration {
            font-size: 16px;
            color: #dca376;
            font-weight: 500;
        }

        /* 底部導覽列 */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #16141a;
            border-top: 1px solid #221f29;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: #736b63;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: #f2ede4;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .floating-action-btn {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background: #dca376;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(220, 163, 118, 0.3);
            z-index: 101;
        }

        .floating-action-btn svg {
            width: 20px;
            height: 20px;
            fill: #121115;
        }

        /* 通用子頁面樣式 (日曆、洞察、選單等) */
        .sub-page {
            display: none;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            flex: 1;
        }

        .sub-page-header {
            font-size: 22px;
            color: #f2ede4;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .sub-page-desc {
            font-size: 12px;
            color: #8c8278;
            margin-bottom: 20px;
        }

        /* 表單彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 17, 21, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            overflow-y: auto;
            z-index: 200;
            padding: 20px;
        }

        .modal-container {
            width: 100%;
            max-width: 400px;
            background: #16141a;
            border: 1px solid #2a2732;
            border-radius: 24px;
            padding: 24px;
            margin: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            color: #dca376;
            font-weight: 500;
        }

        .modal-cancel {
            background: none;
            border: none;
            color: #8c8278;
            font-size: 14px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 12px;
            color: #8c8278;
            margin-bottom: 8px;
            display: block;
        }

        .form-input {
            width: 100%;
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 12px;
            padding: 12px;
            color: #f2ede4;
            font-size: 14px;
        }

        .duration-tags, .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-btn {
            background: #1c1a21;
            border: 1px solid #2a2732;
            color: #8c8278;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .tag-btn.active {
            background: #25201d;
            border-color: #dca376;
            color: #dca376;
        }

        .submit-btn {
            width: 100%;
            background: #dca376;
            color: #121115;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 歷史清單頁面樣式 */
        .history-page {
            display: none;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            flex: 1;
        }

        .search-box {
            width: 100%;
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 16px;
            padding: 12px 16px;
            color: #f2ede4;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .history-item-card {
            background: #1c1a21;
            border: 1px solid #2a2732;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .action-icon-btn {
            background: #25222c;
            border: 1px solid #322e3d;
            color: #d1c7bd;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .action-icon-btn.delete {
            color: #d97777;
            border-color: #3d2828;
            background: #261818;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 主頁面 (概覽) -->
    <div id="mainView" class="container view-section">
        <div class="header-top">
            <button class="menu-btn" onclick="switchView('menu')">☰</button>
            <div class="date-display" id="currentDateHeader">2026年8月13日</div>
        </div>

        <div class="greeting-section">
            <div class="greeting-title" id="greetingText">晚上，</div>
            <div class="greeting-subtitle">夜色溫柔，與自己相處</div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">次數</div>
                <div class="stat-value" id="statCount">1次</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">總時長</div>
                <div class="stat-value" id="statDuration">15分鐘</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">距上次</div>
                <div class="stat-value">-</div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <span class="section-title">本周節律</span>
                <span class="section-sub">1本週次數</span>
            </div>
            <div class="week-grid">
                <div class="week-day-box"><div class="num">0</div>五</div>
                <div class="week-day-box"><div class="num">0</div>六</div>
                <div class="week-day-box"><div class="num">0</div>日</div>
                <div class="week-day-box"><div class="num">0</div>一</div>
                <div class="week-day-box"><div class="num">0</div>二</div>
                <div class="week-day-box"><div class="num">0</div>三</div>
                <div class="week-day-box"><div class="num">0</div>四</div>
            </div>
        </div>

        <div class="quick-add-card">
            <div class="quick-add-text">
                <h3>記下這一次</h3>
                <p>幾秒就好，時間、時長、材料</p>
            </div>
            <button class="plus-btn" onclick="openAddModal()">+</button>
        </div>

        <div>
            <div class="recent-section-header">
                <span class="recent-title">近期</span>
                <a class="view-all-link" onclick="switchView('history')">查看全部 &gt;</a>
            </div>
            <div id="recentListContainer">
                <!-- 動態載入 -->
            </div>
        </div>
    </div>

    <!-- 全部痕跡 / 歷史頁面 -->
    <div id="historyView" class="sub-page view-section">
        <div class="header-top">
            <button class="menu-btn" onclick="switchView('main')">←</button>
            <div class="date-display" id="historyDateHeader">2026年8月13日</div>
        </div>
        <div class="sub-page-header">全部痕跡</div>
        <div class="sub-page-desc" id="historyStatsDesc">共 1 次 · 累計 15 分鐘 · 平均 15 分鐘</div>

        <input type="text" class="search-box" id="searchInput" placeholder="搜尋形式、道具或備註..." oninput="renderRecords()">

        <div style="font-size: 13px; color: #8c8278; margin-bottom: 12px;" id="recordCountLabel">記錄列表 共 1 條</div>

        <div id="fullRecordList"></div>
    </div>

    <!-- 日曆頁面 -->
    <div id="calendarView" class="sub-page view-section">
        <div class="header-top">
            <button class="menu-btn" onclick="switchView('main')">←</button>
            <div class="date-display">2026年8月</div>
        </div>
        <div class="sub-page-header">日曆檢視</div>
        <div class="sub-page-desc">按日檢視您的節律分佈與軌跡</div>
        <div class="section-card" style="text-align: center; padding: 40px 20px; color: #8c8278;">
            日曆功能建構中，將顯示每日頻率分佈
        </div>
    </div>

    <!-- 洞察頁面 -->
    <div id="insightView" class="sub-page view-section">
        <div class="header-top">
            <button class="menu-btn" onclick="switchView('main')">←</button>
            <div class="date-display">數據洞察</div>
        </div>
        <div class="sub-page-header">節律洞察</div>
        <div class="sub-page-desc">長期習慣與形式偏好分析</div>
        <div class="section-card" style="text-align: center; padding: 40px 20px; color: #8c8278;">
            洞察統計圖表與趨勢分析
        </div>
    </div>

    <!-- 側邊選單頁面 -->
    <div id="menuView" class="sub-page view-section">
        <div class="header-top">
            <button class="menu-btn" onclick="switchView('main')">←</button>
            <div class="date-display">設定與選單</div>
        </div>
        <div class="sub-page-header">選單</div>
        <div class="sub-page-desc">王字豪的個人化工具</div>
        <div class="section-card">
            <div style="padding: 10px 0; border-bottom: 1px solid #2a2732; color: #f2ede4; cursor: pointer;" onclick="alert('匯出資料功能')">匯出紀錄備份</div>
            <div style="padding: 10px 0; border-bottom: 1px solid #2a2732; color: #f2ede4; cursor: pointer;" onclick="alert('主題風格設定')">介面風格設定</div>
            <div style="padding: 10px 0; color: #d97777; cursor: pointer;" onclick="if(confirm('清空所有資料？')) { records = []; updateDashboard(); switchView('main'); }">清空所有紀錄</div>
        </div>
    </div>

    <!-- 浮動新增按鈕 -->
    <button class="floating-action-btn" onclick="openAddModal()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <!-- 底部導覽列 -->
    <nav class="nav-bar">
        <button class="nav-item active" id="navMain" onclick="switchView('main')">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            概覽
        </button>
        <button class="nav-item" id="navCalendar" onclick="switchView('calendar')">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
            日曆
        </button>
        <button class="nav-item" onclick="openAddModal()">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            記錄
        </button>
        <button class="nav-item" id="navHistory" onclick="switchView('history')">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            歷史
        </button>
        <button class="nav-item" id="navInsight" onclick="switchView('insight')">
            <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6 3.01 3 5-5H21V12h-3.51l-5-5-3.01 3-6-6L2 5.51l1.5 1.298z"/></svg>
            洞察
        </button>
    </nav>

    <!-- 新增 / 編輯共用彈窗介面 -->
    <div id="recordModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">新增一次</span>
                <button class="modal-cancel" onclick="closeModal()">取消</button>
            </div>

            <input type="hidden" id="editIndex" value="-1">

            <div class="form-group">
                <label class="form-label">時間</label>
                <input type="text" id="recordTime" class="form-input" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">時長 (分鐘)</label>
                <div class="duration-tags" style="margin-bottom: 8px;">
                    <button type="button" class="tag-btn" onclick="setDuration(5)">5分</button>
                    <button type="button" class="tag-btn" onclick="setDuration(10)">10分</button>
                    <button type="button" class="tag-btn active" onclick="setDuration(15)">15分</button>
                    <button type="button" class="tag-btn" onclick="setDuration(20)">20分</button>
                    <button type="button" class="tag-btn" onclick="setDuration(30)">30分</button>
                    <button type="button" class="tag-btn" onclick="setDuration(45)">45分</button>
                    <button type="button" class="tag-btn" onclick="setDuration(60)">60分</button>
                </div>
                <input type="number" id="recordDurationInput" class="form-input" value="15" oninput="syncDurationTag(this.value)">
            </div>

            <div class="form-group">
                <label class="form-label">刺激形式</label>
                <div class="tag-container" id="formForms">
                    <button type="button" class="tag-btn active" onclick="toggleTag(this)">影片</button>
                    <button type="button" class="tag-btn" onclick="toggleTag(this)">圖片</button>
                    <button type="button" class="tag-btn" onclick="toggleTag(this)">文字</button>
                    <button type="button" class="tag-btn" onclick="toggleTag(this)">音頻</button>
                    <button type="button" class="tag-btn" onclick="toggleTag(this)">想像</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">輔助道具</label>
                <div class="tag-container" id="formTools">
                    <button type="button" class="tag-btn active" onclick="toggleTag(this)">手</button>
                    <button type="button" class="tag-btn" onclick="toggleTag(this)">玩具</button>
                    <button type="button" class="tag-btn" onclick="toggleTag(this)">其他</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">備註 (可選)</label>
                <input type="text" id="recordNote" class="form-input" placeholder="此刻的狀態、感受……">
            </div>

            <button class="submit-btn" onclick="saveRecord()">+ 記錄下來</button>
        </div>
    </div>

    <script>
        let records = [
            {
                time: "2026/8/13 19:28",
                duration: 15,
                forms: ["影片"],
                tools: ["手"],
                note: ""
            }
        ];

        // 頁面切換控制 (支援 main, history, calendar, insight, menu)
        function switchView(viewName) {
            const views = ['mainView', 'historyView', 'calendarView', 'insightView', 'menuView'];
            views.forEach(v => {
                document.getElementById(v).style.display = 'none';
            });

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (viewName === 'history') {
                document.getElementById('historyView').style.display = 'block';
                document.getElementById('navHistory').classList.add('active');
                renderRecords();
            } else if (viewName === 'calendar') {
                document.getElementById('calendarView').style.display = 'block';
                document.getElementById('navCalendar').classList.add('active');
            } else if (viewName === 'insight') {
                document.getElementById('insightView').style.display = 'block';
                document.getElementById('navInsight').classList.add('active');
            } else if (viewName === 'menu') {
                document.getElementById('menuView').style.display = 'block';
            } else {
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('navMain').classList.add('active');
                updateDashboard();
            }
            window.scrollTo(0, 0);
        }

        // 開啟新增視窗
        function openAddModal() {
            document.getElementById('modalTitle').innerText = "新增一次";
            document.getElementById('editIndex').value = "-1";
            
            const now = new Date();
            const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('recordTime').value = timeStr;
            document.getElementById('recordDurationInput').value = "15";
            document.getElementById('recordNote').value = "";
            
            resetTags();
            document.getElementById('recordModal').style.display = 'flex';
        }

        // 開啟編輯視窗
        function openEditModal(index) {
            const rec = records[index];
            document.getElementById('modalTitle').innerText = "修改紀錄";
            document.getElementById('editIndex').value = index;
            
            document.getElementById('recordTime').value = rec.time;
            document.getElementById('recordDurationInput').value = rec.duration;
            document.getElementById('recordNote').value = rec.note || "";

            setTagsState('formForms', rec.forms);
            setTagsState('formTools', rec.tools);

            document.getElementById('recordModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('recordModal').style.display = 'none';
        }

        function setDuration(val) {
            document.getElementById('recordDurationInput').value = val;
            document.querySelectorAll('.duration-tags .tag-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(val)) btn.classList.add('active');
            });
        }

        function syncDurationTag(val) {
            document.querySelectorAll('.duration-tags .tag-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === val + '分') btn.classList.add('active');
            });
        }

        function toggleTag(btn) {
            btn.classList.toggle('active');
        }

        function resetTags() {
            document.querySelectorAll('#formForms .tag-btn').forEach((b, i) => {
                if(i === 0) b.classList.add('active'); else b.classList.remove('active');
            });
            document.querySelectorAll('#formTools .tag-btn').forEach((b, i) => {
                if(i === 0) b.classList.add('active'); else b.classList.remove('active');
            });
        }

        function setTagsState(containerId, activeValues) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.tag-btn').forEach(btn => {
                if (activeValues.includes(btn.innerText)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function getActiveTags(containerId) {
            const container = document.getElementById(containerId);
            const active = [];
            container.querySelectorAll('.tag-btn.active').forEach(btn => {
                active.push(btn.innerText);
            });
            return active;
        }

        // 儲存或更新紀錄
        function saveRecord() {
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const time = document.getElementById('recordTime').value;
            const duration = parseInt(document.getElementById('recordDurationInput').value) || 0;
            const forms = getActiveTags('formForms');
            const tools = getActiveTags('formTools');
            const note = document.getElementById('recordNote').value;

            const recordData = { time, duration, forms, tools, note };

            if (editIndex === -1) {
                records.unshift(recordData);
            } else {
                records[editIndex] = recordData;
            }

            closeModal();
            updateDashboard();
            renderRecords();
        }

        // 刪除紀錄
        function deleteRecord(index) {
            if (confirm("確定要刪除這筆紀錄嗎？")) {
                records.splice(index, 1);
                updateDashboard();
                renderRecords();
            }
        }

        // 更新首頁儀表板數據與近期列表
        function updateDashboard() {
            const totalCount = records.length;
            const totalDuration = records.reduce((sum, r) => sum + r.duration, 0);

            document.getElementById('statCount').innerText = totalCount + '次';
            document.getElementById('statDuration').innerText = totalDuration + '分鐘';

            const recentContainer = document.getElementById('recentListContainer');
            if (totalCount === 0) {
                recentContainer.innerHTML = '<div style="color: #8c8278; font-size: 13px; text-align: center; padding: 20px;">尚無記錄</div>';
                return;
            }

            const latest = records[0];
            const titleStr = `${latest.forms.join(' + ')} + ${latest.tools.join(' + ')}`;
            recentContainer.innerHTML = `
                <div class="record-item">
                    <div class="record-info">
                        <h4>${titleStr}</h4>
                        <span>${latest.time}</span>
                    </div>
                    <div class="record-duration">${latest.duration} 分鐘</div>
                </div>
            `;
        }

        // 渲染全部痕跡列表
        function renderRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const listContainer = document.getElementById('fullRecordList');
            
            const filtered = records.map((r, originalIndex) => ({ ...r, originalIndex })).filter(r => {
                const textToSearch = (r.forms.join('') + r.tools.join('') + (r.note || '') + r.time).toLowerCase();
                return textToSearch.includes(keyword);
            });

            document.getElementById('recordCountLabel').innerText = `記錄列表 共 ${filtered.length} 條`;
            
            const totalCount = records.length;
            const totalDuration = records.reduce((sum, r) => sum + r.duration, 0);
            const avgDuration = totalCount > 0 ? Math.round(totalDuration / totalCount) : 0;
            document.getElementById('historyStatsDesc').innerText = `共 ${totalCount} 次 · 累計 ${totalDuration} 分鐘 · 平均 ${avgDuration} 分鐘`;

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="color: #8c8278; font-size: 13px; text-align: center; padding: 30px;">找不到符合的紀錄</div>';
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const titleStr = `${item.forms.join(' + ')} + ${item.tools.join(' + ')}`;
                html += `
                    <div class="history-item-card">
                        <div style="flex: 1;">
                            <div class="record-info">
                                <h4>${titleStr}</h4>
                                <span>${item.time}</span>
                                ${item.note ? `<div style="font-size: 11px; color: #8c8278; margin-top: 4px;">備註: ${item.note}</div>` : ''}
                            </div>
                            <div class="history-item-actions">
                                <button class="action-icon-btn" onclick="openEditModal(${item.originalIndex})">修改</button>
                                <button class="action-icon-btn delete" onclick="deleteRecord(${item.originalIndex})">刪除</button>
                            </div>
                        </div>
                        <div class="record-duration">${item.duration} 分鐘</div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // 初始化
        updateDashboard();
        document.getElementById('historyView').style.display = 'none';
        document.getElementById('calendarView').style.display = 'none';
        document.getElementById('insightView').style.display = 'none';
        document.getElementById('menuView').style.display = 'none';
    </script>
</body>
</html>
